// ============================================================
// Tokyo Ghoul RP — Configuration Serveur
// ============================================================

// --- Identité du serveur ---
hostname "Tokyo Ghoul RP - Développement"
sv_password ""
rcon_password "changez_moi_en_production"

// --- Paramètres réseau (optimisé 120 joueurs) ---
sv_maxrate 0
sv_minrate 100000
sv_maxupdaterate 66
sv_minupdaterate 33
net_maxfilesize 64

// --- Paramètres de jeu ---
sv_loadingurl ""
sv_allowdownload 1
sv_allowupload 0

// --- Anti-crash / stabilité ---
sv_timeout 120
sv_maxcmdrate 66
sv_mincmdrate 33

// --- Logs ---
log on
sv_logbans 1
sv_logecho 1
sv_logfile 1
sv_log_onefile 0

// --- Sandbox désactivé (serveur RP) ---
sbox_noclip 0
sbox_godmode 0
sbox_weapons 0
sbox_playershurtplayers 1
sbox_maxprops 0
sbox_maxragdolls 0
sbox_maxnpcs 0
sbox_maxballoons 0
sbox_maxeffects 0
sbox_maxdynamite 0
sbox_maxlamps 0
sbox_maxthrusters 0
sbox_maxwheels 0
sbox_maxhoverballs 0
sbox_maxvehicles 0
sbox_maxbuttons 0

// --- Voix ---
sv_voiceenable 1
sv_alltalk 0

// --- Chargement de l'addon ---
// L'addon Tokyo Ghoul RP se charge automatiquement depuis addons/
