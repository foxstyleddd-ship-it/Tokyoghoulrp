// ============================================================
// Tokyo Ghoul RP — AutoExec (exécuté au démarrage du serveur)
// ============================================================

// --- Performance serveur (optimisé pour 120 joueurs) ---

// Tickrate (33 = bon compromis performance/réactivité pour RP)
// Note : GMod tourne à 66 ticks par défaut, 33 est plus stable pour 120 joueurs
sv_maxcmdrate 66
sv_mincmdrate 33
sv_maxupdaterate 66
sv_minupdaterate 33

// --- Réseau ---
net_splitpacket_maxrate 50000
net_maxcleartime 0.001

// --- Mémoire / Performance ---
sv_hibernate_think 1
sv_querycache_stats 0

// --- Exécuter server.cfg ---
exec server.cfg
